---
- name: Get QoS statistics for interface {{ interface }}
  ansible.netcommon.cli_command:
    command: "display qos queue statistics interface {{ interface }}"
  register: qos_result

- name: Get current date for filename
  ansible.builtin.shell:
    cmd: date +%Y-%m-%d
  register: file_date
  changed_when: false
  delegate_to: localhost

- name: Set current_date_value variable
  ansible.builtin.set_fact:
    current_date_value: "{{ file_date.stdout }}"

- name: Append CSV rows to file
  ansible.builtin.lineinfile:
    path: "{{ output_dir }}/{{ inventory_hostname }}_qos_{{ current_date_value }}.csv"
    line: '{{ csv_line }}'
    create: no
  delegate_to: localhost
  loop: "{{ range(0, 8) | list }}"
  vars:
    csv_line: '"{{ inventory_hostname }}","{{ interface }}","queue_{{ item }}","0","{{ dropped_add }}","{{ timestamp_now }}"'
    host_key: "{{ inventory_hostname }}_{{ interface }}"
    hist_val: "{{ historical_data.get(host_key, {}).get('queue_' ~ item, 0) | default(0) }}"
    dropped_add: "{{ [0 - hist_val | int, 0] | max }}"
    timestamp_now: "{{ lookup('pipe', 'date -Iseconds') }}"
