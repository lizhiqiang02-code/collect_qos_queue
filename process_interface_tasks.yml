- name: Generate all CSV data
  ansible.builtin.set_fact:
    all_csv_data: |
      {% for i in range(0, 8) %}
      {% set host_key = inventory_hostname ~ '_' ~ interface %}
      {% set hist_val = historical_data.get(host_key, {}).get('queue_' ~ i, 0) | default(0) %}
      {% set dropped_add = [0 - hist_val | int, 0] | max %}
      "{{ inventory_hostname }}","{{ interface }}","queue_{{ i }}","0","{{ dropped_add }}","{{ current_timestamp }}"
      {% endfor %}

- name: Append all CSV data at once
  ansible.builtin.blockinfile:
    path: "{{ output_dir }}/{{ inventory_hostname }}_qos_{{ current_date_value }}.csv"
    block: "{{ all_csv_data }}"
    insertafter: EOF
    marker: ""  # 不添加标记
  delegate_to: localhost
