---
- name: Get QoS statistics for interface {{ interface }}
  ansible.netcommon.cli_command:
    command: "display qos queue statistics interface {{ interface }}"
  register: qos_result

- name: Get current date for filename
  ansible.builtin.shell:
    cmd: date +%Y-%m-%d
  register: file_date
  changed_when: false
  delegate_to: localhost

- name: Set current_date_value variable
  ansible.builtin.set_fact:
    current_date_value: "{{ file_date.stdout }}"

- name: Get current timestamp
  ansible.builtin.set_fact:
    current_timestamp: "{{ lookup('pipe', 'date -Iseconds') }}"

- name: Create output directory
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

# 步骤1：创建文件（如果不存在）并添加表头
- name: Create CSV file with headers if not exists
  ansible.builtin.copy:
    dest: "{{ output_dir }}/{{ inventory_hostname }}_qos_{{ current_date_value }}.csv"
    content: '"hostname","interface","queue","packets","dropped","timestamp"'
    mode: '0644'
  delegate_to: localhost
  when: not lookup('file', output_dir ~ '/' ~ inventory_hostname ~ '_qos_' ~ current_date_value ~ '.csv', errors='ignore')

# 步骤2：调试 - 显示生成的数据
- name: Debug - Show generated CSV lines
  ansible.builtin.debug:
    msg: |
      CSV Line for queue_{{ item }}:
      {{ csv_line }}
  loop: "{{ range(0, 8) | list }}"
  loop_control:
    label: "queue_{{ item }}"
  vars:
    csv_line: '"{{ inventory_hostname }}","{{ interface }}","queue_{{ item }}","0","{{ dropped_add }}","{{ current_timestamp }}"'
    host_key: "{{ inventory_hostname }}_{{ interface }}"
    hist_val: "{{ historical_data.get(host_key, {}).get('queue_' ~ item, 0) | default(0) }}"
    dropped_add: "{{ [0 - hist_val | int, 0] | max }}"

# 步骤3：追加数据行
- name: Append CSV data rows
  ansible.builtin.lineinfile:
    path: "{{ output_dir }}/{{ inventory_hostname }}_qos_{{ current_date_value }}.csv"
    line: '{{ csv_line }}'
    create: no  # 文件必须已存在
    insertafter: EOF
  delegate_to: localhost
  loop: "{{ range(0, 8) | list }}"
  vars:
    csv_line: '"{{ inventory_hostname }}","{{ interface }}","queue_{{ item }}","0","{{ dropped_add }}","{{ current_timestamp }}"'
    host_key: "{{ inventory_hostname }}_{{ interface }}"
    hist_val: "{{ historical_data.get(host_key, {}).get('queue_' ~ item, 0) | default(0) }}"
    dropped_add: "{{ [0 - hist_val | int, 0] | max }}"
