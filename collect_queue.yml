---
- name: Update QoS CSV without Description Column
  hosts: all
  gather_facts: no
  
  vars:
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    interfaces_dir: "./interfaces"
    
    # 设备信息变量
    host_name: "{{ device_name | default(inventory_hostname) }}"
    device_sn: "{{ device_serial | default('UNKNOWN_SN') }}"
    device_type: "{{ device_model | default('CE8860-4C-EI') }}"
    device_ip: "{{ inventory_hostname }}"
    
    # 输出文件名格式
    output_filename: "{{ host_name }}_{{ device_sn }}_queue.csv"
    
  tasks:
    - name: Debug device information
      debug:
        msg: |
          设备信息汇总:
          设备名称: {{ host_name }}
          序列号: {{ device_sn }}
          设备型号: {{ device_type }}
          IP地址: {{ device_ip }}
          输出文件名: {{ output_filename }}
      delegate_to: localhost
    
    - name: Load interface configuration by device type
      include_vars:
        file: "{{ interfaces_dir }}/{{ device_type }}_interfaces.yml"
        name: interface_config
      ignore_errors: yes
      delegate_to: localhost
    
    - name: Check if configuration was loaded
      fail:
        msg: |
          设备类型 {{ device_type }} 的接口配置文件不存在！
          请创建文件: {{ interfaces_dir }}/{{ device_type }}_interfaces.yml
      when: interface_config.interfaces is not defined
      delegate_to: localhost
    
    - name: Extract interface names
      set_fact:
        interface_names: "{{ interface_config.interfaces | map(attribute='name') | list }}"
      delegate_to: localhost
    
    - name: Get current timestamp
      shell: date +"%Y-%m-%dT%H:%M:%S"
      register: current_ts
      delegate_to: localhost
    
    - name: Set timestamp fact
      set_fact:
        new_timestamp: "{{ current_ts.stdout }}"
        new_column: "Dropped-{{ current_ts.stdout }}"
    
    - name: Collect QoS statistics for all interfaces
      cli_command:
        command: "display qos queue statistics interface {{ item }}"
      register: qos_results
      loop: "{{ interface_names }}"
    
    - name: Create CSV update script without description
      copy:
        content: |
          #!/usr/bin/env python3
          import csv
          import re
          import sys
          import os
          import subprocess
          import json
          
          def parse_qos_output(output):
              """解析QoS输出"""
              result = {}
              for q in range(8):
                  queue_key = f'queue_{q}'
                  value = 0
                  for line in output.split('\n'):
                      if f'Queue {q}' in line:
                          numbers = re.findall(r'-?\b\d+\b', line)
                          if numbers:
                              try:
                                  value = int(numbers[-1])
                              except ValueError:
                                  value = 0
                          break
                  result[queue_key] = value
              return result
          
          def remove_description_column(rows):
              """从现有数据行中移除Description列"""
              new_rows = []
              for row in rows:
                  if len(row) >= 6:  # 确保有Description列
                      # 移除第5列（索引4）的Description列
                      # 原格式: host_name,sn,type,ip,Interface,Description,Queue,Dropped-Add,...
                      # 新格式: host_name,sn,type,ip,Interface,Queue,Dropped-Add,...
                      new_row = row[:4] + row[5:]  # 跳过索引4的Description列
                      new_rows.append(new_row)
                  else:
                      new_rows.append(row)
              return new_rows
          
          def main():
              print("=" * 80)
              print("QoS CSV数据更新 (无Description列)")
              print("=" * 80)
              
              if len(sys.argv) < 10:
                  print("用法: python3 script.py <host_name> <device_sn> <device_type> <device_ip> <server> <user> <password> <path> <new_column> <interfaces_json> <qos_outputs...>")
                  sys.exit(1)
              
              # 设备信息参数
              host_name = sys.argv[1]
              device_sn = sys.argv[2]
              device_type = sys.argv[3]
              device_ip = sys.argv[4]
              
              # 服务器参数
              server = sys.argv[5]
              user = sys.argv[6]
              password = sys.argv[7]
              base_path = sys.argv[8]
              new_column = sys.argv[9]
              
              # 构建输出文件路径
              output_filename = f"{host_name}_{device_sn}_queue.csv"
              remote_path = f"{base_path}/{output_filename}"
              
              # 接口信息
              interfaces = json.loads(sys.argv[10])
              
              print(f"设备名称: {host_name}")
              print(f"设备SN: {device_sn}")
              print(f"输出文件: {output_filename}")
              print(f"接口数量: {len(interfaces)}")
              print(f"新时间戳: {new_column}")
              
              # 解析QoS数据
              qos_data_map = {}
              for i, interface in enumerate(interfaces):
                  if i + 11 < len(sys.argv):
                      output = sys.argv[i + 11].replace('\\n', '\n')
                      qos_data_map[interface] = parse_qos_output(output)
              
              # 检查文件是否存在
              check_cmd = f"sshpass -p '{password}' ssh -o StrictHostKeyChecking=no {user}@{server} 'test -f \"{remote_path}\"'"
              
              file_exists = False
              try:
                  result = subprocess.run(check_cmd, shell=True, capture_output=True, text=True, timeout=5)
                  file_exists = result.returncode == 0
                  print(f"文件存在: {file_exists}")
              except Exception as e:
                  print(f"检查文件错误: {e}")
              
              if file_exists:
                  # 下载现有文件
                  print("下载现有CSV文件...")
                  download_cmd = f"sshpass -p '{password}' scp -o StrictHostKeyChecking=no {user}@{server}:\"{remote_path}\" /tmp/{output_filename}"
                  try:
                      subprocess.run(download_cmd, shell=True, check=True, timeout=10)
                      
                      # 读取现有文件
                      rows = []
                      with open(f'/tmp/{output_filename}', 'r') as f:
                          for line in f:
                              if line.strip():
                                  rows.append([field.strip() for field in line.split(',')])
                      
                      print(f"现有文件行数: {len(rows)}")
                      
                      if len(rows) > 0:
                          # 检查现有表头格式
                          current_header = rows[0]
                          print(f"现有表头: {current_header}")
                          
                          # 如果表头中有Description列，移除它
                          if 'Description' in current_header:
                              print("检测到Description列，正在移除...")
                              rows = remove_description_column(rows)
                              # 更新表头
                              new_header = [col for col in current_header if col != 'Description']
                              if new_column not in new_header:
                                  new_header.append(new_column)
                              rows[0] = new_header
                          else:
                              # 添加新列到表头
                              if new_column not in rows[0]:
                                  rows[0].append(new_column)
                                  print(f"添加新列: {new_column}")
                          
                          # 确保所有行有足够的列
                          header_len = len(rows[0])
                          for i in range(1, len(rows)):
                              while len(rows[i]) < header_len:
                                  rows[i].append("0")
                          
                          # 检查现有接口
                          existing_interfaces = set()
                          for i in range(1, len(rows)):
                              if len(rows[i]) > 4:  # Interface列索引（移除Description后）
                                  existing_interfaces.add(rows[i][4])
                          
                          print(f"现有文件中的接口: {sorted(existing_interfaces)}")
                          
                          # 添加缺失的接口
                          added_count = 0
                          for interface in interfaces:
                              if interface not in existing_interfaces:
                                  print(f"添加缺失接口: {interface}")
                                  for q in range(8):
                                      queue = f'queue_{q}'
                                      value = qos_data_map.get(interface, {}).get(queue, 0)
                                      
                                      # 创建新行（无Description列）
                                      new_row = [host_name, device_sn, device_type, device_ip, interface, queue, "0", str(value)]
                                      
                                      # 补齐缺失的时间戳列
                                      while len(new_row) < header_len:
                                          new_row.append("0")
                                      
                                      rows.append(new_row)
                                      added_count += 1
                          
                          if added_count > 0:
                              print(f"添加了 {added_count} 行新接口数据")
                          
                          # 更新新列的值
                          if new_column in rows[0]:
                              new_col_idx = rows[0].index(new_column)
                              updated_count = 0
                              
                              for i in range(1, len(rows)):
                                  if len(rows[i]) > 5:  # 至少要有Queue列（移除Description后）
                                      interface = rows[i][4]  # Interface列
                                      queue = rows[i][5]      # Queue列（索引5，因为移除了Description）
                                      
                                      value = "0"
                                      if interface in qos_data_map and queue in qos_data_map[interface]:
                                          value = str(qos_data_map[interface][queue])
                                      
                                      rows[i][new_col_idx] = value
                                      updated_count += 1
                              
                              print(f"更新了 {updated_count} 行数据")
                          
                          # 重新计算Dropped-Add
                          if len(rows[0]) >= 8:  # 至少有1个时间戳列（移除Description后）
                              timestamp_indices = [i for i, h in enumerate(rows[0]) if h.startswith('Dropped-') and h != 'Dropped-Add']
                              
                              if len(timestamp_indices) >= 2:
                                  last_idx = timestamp_indices[-1]
                                  prev_idx = timestamp_indices[-2]
                                  updated_add_count = 0
                                  
                                  for i in range(1, len(rows)):
                                      if len(rows[i]) > max(last_idx, prev_idx):
                                          try:
                                              last_val = int(rows[i][last_idx])
                                              prev_val = int(rows[i][prev_idx])
                                              diff = last_val - prev_val
                                              if len(rows[i]) > 6:  # Dropped-Add列索引（移除Description后）
                                                  rows[i][6] = str(diff)
                                                  updated_add_count += 1
                                          except Exception as e:
                                              pass
                                  
                                  print(f"更新了 {updated_add_count} 行的Dropped-Add值")
                      
                  except Exception as e:
                      print(f"处理现有文件错误: {e}")
                      file_exists = False
              
              if not file_exists:
                  # 创建新文件（无Description列）
                  print("创建新的CSV文件...")
                  headers = ["host_name", "sn", "type", "ip", "Interface", "Queue", "Dropped-Add", new_column]
                  rows = [headers]
                  
                  for interface in interfaces:
                      for q in range(8):
                          queue = f'queue_{q}'
                          value = qos_data_map.get(interface, {}).get(queue, 0)
                          rows.append([host_name, device_sn, device_type, device_ip, interface, queue, "0", str(value)])
                  
                  print(f"创建了 {len(rows)-1} 行数据")
              
              # 保存文件
              temp_file = f'/tmp/{output_filename}'
              with open(temp_file, 'w', newline='') as f:
                  writer = csv.writer(f)
                  writer.writerows(rows)
              
              print(f"\n保存文件: {temp_file}")
              print(f"总行数: {len(rows)}")
              print(f"表头: {rows[0]}")
              
              # 上传文件
              print("上传到远程服务器...")
              upload_cmd = f"sshpass -p '{password}' scp -o StrictHostKeyChecking=no {temp_file} {user}@{server}:\"{remote_path}\""
              try:
                  subprocess.run(upload_cmd, shell=True, check=True, timeout=10)
                  print(f"\n✓ 成功更新: {remote_path}")
                  
                  # 显示统计信息
                  print(f"\n" + "=" * 80)
                  print("更新统计:")
                  print(f"  输出文件: {output_filename}")
                  print(f"  表头格式: {rows[0]}")
                  print(f"  总行数: {len(rows)}")
                  print(f"  接口数量: {len(interfaces)}")
                  print("=" * 80)
                  
              except Exception as e:
                  print(f"\n✗ 上传失败: {e}")
                  sys.exit(1)
              
              # 清理临时文件
              try:
                  os.remove(temp_file)
              except:
                  pass
          
          if __name__ == "__main__":
              main()
        dest: "/tmp/update_no_description.py"
        mode: '0755'
      delegate_to: localhost
    
    - name: Run CSV update without description
      shell: |
        python3 /tmp/update_no_description.py \
          "{{ host_name }}" \
          "{{ device_sn }}" \
          "{{ device_type }}" \
          "{{ device_ip }}" \
          "{{ report_server }}" \
          "root" \
          "3edc\$RFV" \
          "{{ report_path }}" \
          "{{ new_column }}" \
          '{{ interface_names | to_json }}' \
          {% for result in qos_results.results %}
          "{{ result.stdout | replace('\n', '\\n') | replace('\"', '\\\"') }}" \
          {% endfor %}
      args:
        executable: /bin/bash
      register: script_output
      delegate_to: localhost
    
    - name: Show script output
      debug:
        var: script_output.stdout_lines
    
    - name: Verify the output file
      shell: |
        sshpass -p '3edc$RFV' ssh -o StrictHostKeyChecking=no root@{{ report_server }} \
          "echo '=== 验证文件 ===' && \
           echo '文件: {{ report_path }}/{{ output_filename }}' && \
           echo '文件大小:' && \
           ls -lh {{ report_path }}/{{ output_filename }} && \
           echo '行数:' && \
           wc -l {{ report_path }}/{{ output_filename }} && \
           echo '表头:' && \
           head -1 {{ report_path }}/{{ output_filename }} && \
           echo '列数:' && \
           head -1 {{ report_path }}/{{ output_filename }} | tr ',' '\\n' | wc -l && \
           echo '前2行数据:' && \
           tail -n +2 {{ report_path }}/{{ output_filename }} | head -2"
      args:
        executable: /bin/bash
      register: verify_output
      delegate_to: localhost
    
    - name: Show verification result
      debug:
        var: verify_output.stdout_lines
