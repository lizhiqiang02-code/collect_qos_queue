---
- name: Monitor QoS Alerts (Flexible)
  hosts: localhost
  gather_facts: no
  
  vars:
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=c37ae8a6-be4d-4dba-afd3-5e457369203a"
  
  tasks:
    - name: Get current time
      shell: date +"%Y-%m-%d %H:%M:%S"
      register: current_time
    
    - name: Create flexible monitoring script
      copy:
        content: |
          #!/usr/bin/env python3
          import sys
          import os
          import subprocess
          import json
          import time
          
          def download_and_analyze(server, user, password, remote_path):
              alerts = []
              
              # Get file list
              list_cmd = f"sshpass -p '{password}' ssh -o StrictHostKeyChecking=no {user}@{server} 'ls {remote_path}/*_qos.csv 2>/dev/null'"
              
              try:
                  result = subprocess.run(list_cmd, shell=True, capture_output=True, text=True)
                  remote_files = [f.strip() for f in result.stdout.strip().split('\n') if f.strip()]
              except Exception as e:
                  print(f"Error getting file list: {e}")
                  return alerts
              
              print(f"Found {len(remote_files)} CSV files")
              
              for remote_file in remote_files:
                  filename = os.path.basename(remote_file)
                  local_file = f"/tmp/{filename}"
                  
                  # Download file
                  download_cmd = f"sshpass -p '{password}' scp -o StrictHostKeyChecking=no {user}@{server}:\"{remote_file}\" \"{local_file}\""
                  
                  try:
                      subprocess.run(download_cmd, shell=True, check=True)
                      print(f"Downloaded: {filename}")
                  except Exception as e:
                      print(f"Error downloading {filename}: {e}")
                      continue
                  
                  # Analyze file
                  try:
                      with open(local_file, 'r') as f:
                          lines = f.readlines()
                      
                      if len(lines) < 2:
                          print(f"File {filename} has insufficient lines")
                          os.remove(local_file)
                          continue
                      
                      # Parse header
                      headers = [h.strip() for h in lines[0].split(',')]
                      
                      # Find column indices
                      host_idx = -1
                      interface_idx = -1
                      queue_idx = -1
                      dropped_add_idx = -1
                      
                      for i, header in enumerate(headers):
                          header_lower = header.lower()
                          if 'host' in header_lower:
                              host_idx = i
                          elif 'interface' in header_lower:
                              interface_idx = i
                          elif 'queue' in header_lower:
                              queue_idx = i
                          elif 'dropped-add' in header_lower:
                              dropped_add_idx = i
                      
                      if host_idx == -1: host_idx = 0
                      if interface_idx == -1: interface_idx = 1
                      if queue_idx == -1: queue_idx = 2
                      if dropped_add_idx == -1:
                          # Try to find any column containing 'dropped-add'
                          for i, header in enumerate(headers):
                              if 'dropped-add' in header.lower():
                                  dropped_add_idx = i
                                  break
                          else:
                              dropped_add_idx = 3
                      
                      print(f"  Analyzing {filename}: Host col={host_idx}, Interface col={interface_idx}, Queue col={queue_idx}, Dropped-Add col={dropped_add_idx}")
                      
                      # Analyze data rows
                      file_alerts = 0
                      for line_num, line in enumerate(lines[1:], 2):
                          if not line.strip():
                              continue
                          
                          row = [field.strip() for field in line.split(',')]
                          needed_idx = max(host_idx, interface_idx, queue_idx, dropped_add_idx)
                          
                          if len(row) <= needed_idx:
                              continue
                          
                          host = row[host_idx]
                          interface = row[interface_idx]
                          queue = row[queue_idx]
                          
                          # Get Dropped-Add value
                          dropped_add_str = row[dropped_add_idx] if dropped_add_idx < len(row) else "0"
                          
                          try:
                              dropped_add = int(float(dropped_add_str))
                          except ValueError:
                              dropped_add = 0
                          
                          # Check alert condition (Dropped-Add > 1)
                          if dropped_add > 1:
                              alerts.append({
                                  'host': host,
                                  'interface': interface,
                                  'queue': queue,
                                  'dropped_packets': dropped_add,
                                  'file': filename,
                                  'line': line_num
                              })
                              file_alerts += 1
                      
                      print(f"  Found {file_alerts} alerts in {filename}")
                      
                  except Exception as e:
                      print(f"Error analyzing {filename}: {e}")
                  
                  # Clean up
                  try:
                      os.remove(local_file)
                  except:
                      pass
              
              return alerts
          
          def send_alert(alert, webhook_url, alert_time, current_time):
              host = alert['host']
              interface = alert['interface']
              queue = alert['queue']
              dropped_packets = alert['dropped_packets']
              
              alert_msg = f"""[告警级别]: Warning
          [告警设备]: {host}
          [事件]:硬件QOS队列丢包
          [状态]: PROBLEM
          [地址]: {host}
          [内容]:{host} {interface} {queue}队列丢包数{dropped_packets}
          [告警时间]:{alert_time}
          [当前时间]:{current_time}
          告警源：AWX告警"""
              
              json_data = {
                  "msgtype": "text",
                  "text": {
                      "content": alert_msg
                  }
              }
              
              curl_cmd = f"curl -s -X POST -H 'Content-Type: application/json' -d '{json.dumps(json_data)}' '{webhook_url}'"
              
              try:
                  result = subprocess.run(curl_cmd, shell=True, capture_output=True, text=True, timeout=10)
                  if result.returncode == 0:
                      return True
                  else:
                      print(f"  Curl error: {result.stderr}")
                      return False
              except Exception as e:
                  print(f"  Error sending alert: {e}")
                  return False
          
          def main():
              if len(sys.argv) != 7:
                  print("Usage: python3 script.py <server> <user> <password> <path> <webhook_url> <alert_time>")
                  sys.exit(1)
              
              server = sys.argv[1]
              user = sys.argv[2]
              password = sys.argv[3]
              remote_path = sys.argv[4]
              webhook_url = sys.argv[5]
              alert_time = sys.argv[6]
              
              current_time = time.strftime("%Y-%m-%d %H:%M:%S", time.localtime())
              
              print("=" * 60)
              print("Starting QoS Alert Monitoring")
              print("=" * 60)
              print(f"Server: {server}")
              print(f"Path: {remote_path}")
              print(f"Alert Time: {alert_time}")
              print(f"Current Time: {current_time}")
              print("=" * 60)
              
              # Download and analyze
              alerts = download_and_analyze(server, user, password, remote_path)
              
              if alerts:
                  print(f"\nTotal alerts found: {len(alerts)}")
                  print("-" * 40)
                  
                  success_count = 0
                  for i, alert in enumerate(alerts, 1):
                      print(f"\nAlert {i}/{len(alerts)}:")
                      print(f"  Host: {alert['host']}")
                      print(f"  Interface: {alert['interface']}")
                      print(f"  Queue: {alert['queue']}")
                      print(f"  Dropped Packets: {alert['dropped_packets']}")
                      print(f"  File: {alert['file']} (line {alert['line']})")
                      
                      if send_alert(alert, webhook_url, alert_time, current_time):
                          success_count += 1
                          print(f"  Status: ✓ Sent successfully")
                      else:
                          print(f"  Status: ✗ Failed to send")
                  
                  print("\n" + "=" * 60)
                  print("Alert Summary:")
                  print(f"  Total Alerts: {len(alerts)}")
                  print(f"  Successfully Sent: {success_count}")
                  print(f"  Failed: {len(alerts) - success_count}")
                  print("=" * 60)
              else:
                  print("\nNo alerts found (Dropped-Add ≤ 1 for all queues)")
                  print("=" * 60)
          
          if __name__ == "__main__":
              main()
        dest: "/tmp/monitor_qos_flexible.py"
        mode: '0755'
    
    - name: Run flexible monitoring script
      shell: |
        python3 /tmp/monitor_qos_flexible.py \
          "{{ report_server }}" \
          "root" \
          "3edc\$RFV" \
          "{{ report_path }}" \
          "{{ webhook_url }}" \
          "{{ current_time.stdout }}"
      args:
        executable: /bin/bash
      register: monitor_result
    
    - name: Show monitoring results
      debug:
        var: monitor_result.stdout_lines
