---
- name: Update QoS CSV Data (Flexible Interfaces)
  hosts: all
  gather_facts: no
  
  vars:
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    interfaces:
      - "100GE1/1/1"
      - "100GE1/1/2"
      - "25GE1/1/1"  # 新增的接口
      - "25GE1/1/2"  # 新增的接口
  
  tasks:
    - name: Get current timestamp
      shell: date +"%Y-%m-%dT%H:%M:%S"
      register: current_ts
      delegate_to: localhost
    
    - name: Set timestamp fact
      set_fact:
        new_timestamp: "{{ current_ts.stdout }}"
        new_column: "Dropped-{{ current_ts.stdout }}"
    
    - name: Collect QoS statistics for all interfaces
      cli_command:
        command: "display qos queue statistics interface {{ item }}"
      register: qos_results
      loop: "{{ interfaces }}"
    
    - name: Create flexible update script
      copy:
        content: |
          #!/usr/bin/env python3
          import csv
          import re
          import sys
          import os
          import subprocess
          import json
          
          def parse_qos_output(output):
              result = {}
              for q in range(8):
                  queue_key = f'queue_{q}'
                  value = 0
                  for line in output.split('\n'):
                      if f'Queue {q}' in line:
                          numbers = re.findall(r'\b\d+\b', line)
                          if numbers:
                              value = int(numbers[-1])
                          break
                  result[queue_key] = value
              return result
          
          def main():
              if len(sys.argv) < 7:
                  print("Usage: python3 script.py <hostname> <server> <user> <password> <path> <new_column> <interfaces_json> <qos_outputs...>")
                  sys.exit(1)
              
              hostname = sys.argv[1]
              server = sys.argv[2]
              user = sys.argv[3]
              password = sys.argv[4]
              remote_path = sys.argv[5]
              new_column = sys.argv[6]
              
              # 解析接口列表
              interfaces = json.loads(sys.argv[7])
              
              # 解析QoS输出
              qos_data = {}
              for i, interface in enumerate(interfaces):
                  if i + 8 < len(sys.argv):
                      output = sys.argv[i + 8].replace('\\n', '\n')
                      qos_data[interface] = parse_qos_output(output)
              
              print(f"Processing interfaces: {interfaces}")
              print(f"Got QoS data for interfaces: {list(qos_data.keys())}")
              
              # 检查文件是否存在
              check_cmd = f"sshpass -p '{password}' ssh -o StrictHostKeyChecking=no {user}@{server} 'test -f {remote_path} && echo exists'"
              
              try:
                  result = subprocess.run(check_cmd, shell=True, capture_output=True, text=True)
                  file_exists = "exists" in result.stdout.strip()
              except Exception as e:
                  print(f"Error checking file: {e}")
                  file_exists = False
              
              if file_exists:
                  print(f"File exists, updating: {remote_path}")
                  # 下载现有文件
                  download_cmd = f"sshpass -p '{password}' scp -o StrictHostKeyChecking=no {user}@{server}:{remote_path} /tmp/temp_qos.csv"
                  try:
                      subprocess.run(download_cmd, shell=True, check=True)
                  except Exception as e:
                      print(f"Error downloading file: {e}")
                      file_exists = False
              
              if file_exists:
                  # 读取并更新现有文件
                  rows = []
                  with open('/tmp/temp_qos.csv', 'r') as f:
                      for line in f:
                          if line.strip():
                              cleaned = [field.strip() for field in line.split(',')]
                              rows.append(cleaned)
                  
                  # 检查是否已包含所有接口
                  existing_interfaces = set()
                  for i in range(1, len(rows)):
                      if len(rows[i]) >= 2:
                          existing_interfaces.add(rows[i][1])
                  
                  print(f"Existing interfaces in CSV: {existing_interfaces}")
                  print(f"Target interfaces: {interfaces}")
                  
                  # 添加缺失的接口
                  for interface in interfaces:
                      if interface not in existing_interfaces:
                          print(f"Adding missing interface: {interface}")
                          for q in range(8):
                              queue = f"queue_{q}"
                              value = qos_data.get(interface, {}).get(queue, 0)
                              rows.append([hostname, interface, queue, "0", str(value)])
                  
                  # 添加新列到表头
                  if new_column not in rows[0]:
                      rows[0].append(new_column)
                  
                  # 确保所有行都有足够的列
                  header_len = len(rows[0])
                  for i in range(1, len(rows)):
                      while len(rows[i]) < header_len:
                          rows[i].append("0")
                  
                  # 更新新列的值
                  new_col_index = rows[0].index(new_column)
                  for i in range(1, len(rows)):
                      if len(rows[i]) >= 3:
                          interface = rows[i][1]
                          queue = rows[i][2]
                          
                          value = "0"
                          if interface in qos_data and queue in qos_data[interface]:
                              value = str(qos_data[interface][queue])
                          
                          rows[i][new_col_index] = value
                  
                  # 计算Dropped-Add
                  if len(rows[0]) >= 5:
                      timestamp_indices = []
                      for idx, header in enumerate(rows[0]):
                          if 'Dropped-' in header and header != 'Dropped-Add':
                              timestamp_indices.append(idx)
                      
                      if len(timestamp_indices) >= 2:
                          for i in range(1, len(rows)):
                              if len(rows[i]) > max(timestamp_indices[-1], timestamp_indices[-2]):
                                  try:
                                      last_val = int(rows[i][timestamp_indices[-1]])
                                      prev_val = int(rows[i][timestamp_indices[-2]])
                                      diff = max(0, last_val - prev_val)
                                      if len(rows[i]) > 3:
                                          rows[i][3] = str(diff)
                                  except:
                                      pass
              else:
                  print(f"Creating new file: {remote_path}")
                  # 创建新文件
                  headers = ["Host", "Interface", "Queue", "Dropped-Add", new_column]
                  rows = [headers]
                  
                  for interface in interfaces:
                      for q in range(8):
                          queue = f"queue_{q}"
                          value = qos_data.get(interface, {}).get(queue, 0)
                          rows.append([hostname, interface, queue, "0", str(value)])
              
              # 保存并上传
              temp_file = '/tmp/qos_updated.csv'
              with open(temp_file, 'w', newline='') as f:
                  writer = csv.writer(f)
                  writer.writerows(rows)
              
              upload_cmd = f"sshpass -p '{password}' scp -o StrictHostKeyChecking=no {temp_file} {user}@{server}:{remote_path}"
              try:
                  subprocess.run(upload_cmd, shell=True, check=True)
                  print(f"Successfully updated: {hostname}")
                  print(f"Total rows: {len(rows)}")
                  print(f"Interfaces in CSV: {set([row[1] for row in rows[1:] if len(row) > 1])}")
              except Exception as e:
                  print(f"Error uploading file: {e}")
                  sys.exit(1)
          
          if __name__ == "__main__":
              main()
        dest: "/tmp/update_qos_flexible.py"
        mode: '0755'
      delegate_to: localhost
    
    - name: Prepare QoS outputs as JSON list
      set_fact:
        qos_outputs_json: "{{ qos_results.results | map(attribute='stdout') | list | to_json }}"
      delegate_to: localhost
    
    - name: Run flexible update script
      shell: |
        python3 /tmp/update_qos_flexible.py \
          "{{ inventory_hostname }}" \
          "{{ report_server }}" \
          "root" \
          "3edc\$RFV" \
          "{{ report_path }}/{{ inventory_hostname }}_qos.csv" \
          "{{ new_column }}" \
          '{{ interfaces | to_json }}' \
          {% for result in qos_results.results %}
          "{{ result.stdout | replace('\n', '\\n') | replace('\"', '\\\"') }}" \
          {% endfor %}
      args:
        executable: /bin/bash
      delegate_to: localhost
      
    - name: Show completion message
      debug:
        msg: |
          QoS data updated for {{ inventory_hostname }}
          Interfaces: {{ interfaces }}
          New column: {{ new_column }}
