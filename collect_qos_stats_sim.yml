---
- name: Collect QoS Queue Dropped Statistics for Huawei Switches
  hosts: all
  gather_facts: no
  vars:
    output_dir: "/runner/project/qos_reports"
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    historical_file: "{{ report_path }}/{{ inventory_hostname }}_qos.csv"
    interfaces:
      - "100GE1/1/1"
      - "100GE1/1/2"
    
  tasks:
    # 1. 获取精确到秒的时间戳
    - name: Get current timestamp
      shell: date +"%Y-%m-%dT%H:%M:%S"
      register: timestamp_cmd
      changed_when: false
      delegate_to: localhost
    
    - name: Set timestamp fact
      set_fact:
        current_timestamp: "{{ timestamp_cmd.stdout }}"
        timestamp_column: "Dropped-{{ timestamp_cmd.stdout }}"
    
    # 2. 创建本地输出目录
    - name: Create output directory
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
    
    # 3. 收集QoS数据
    - name: Collect QoS statistics
      cli_command:
        command: "display qos queue statistics interface {{ item }}"
      register: qos_output
      loop: "{{ interfaces }}"
    
    # 4. 初始化解析数据变量
    - name: Initialize parsed data
      set_fact:
        parsed_qos_data: {}
      delegate_to: localhost
    
    # 5. 解析QoS数据 - 逐个接口处理
    - name: Parse QoS data for first interface
      set_fact:
        parsed_qos_data: "{{ parsed_qos_data | combine({ interface_name: queue_stats }) }}"
      when: qos_output.results|length > 0
      delegate_to: localhost
      vars:
        interface_name: "{{ qos_output.results[0].item }}"
        queue_stats: >-
          {%- set lines = qos_output.results[0].stdout_lines -%}
          {%- set result = {} -%}
          {%- for q in range(8) -%}
            {%- set queue_key = 'queue_' ~ q -%}
            {%- set value = 0 -%}
            {%- for line in lines -%}
              {%- if 'Queue ' ~ q in line -%}
                {%- set parts = line.split() -%}
                {%- for part in parts -%}
                  {%- if part == '0' or part|int > 0 -%}
                    {%- set value = part|int -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set _ = result.update({queue_key: value}) -%}
          {%- endfor -%}
          {{ result }}
    
    # 6. 如果有第二个接口，也解析
    - name: Parse QoS data for second interface
      set_fact:
        parsed_qos_data: "{{ parsed_qos_data | combine({ interface_name: queue_stats }) }}"
      when: qos_output.results|length > 1
      delegate_to: localhost
      vars:
        interface_name: "{{ qos_output.results[1].item }}"
        queue_stats: >-
          {%- set lines = qos_output.results[1].stdout_lines -%}
          {%- set result = {} -%}
          {%- for q in range(8) -%}
            {%- set queue_key = 'queue_' ~ q -%}
            {%- set value = 0 -%}
            {%- for line in lines -%}
              {%- if 'Queue ' ~ q in line -%}
                {%- set parts = line.split() -%}
                {%- for part in parts -%}
                  {%- if part == '0' or part|int > 0 -%}
                    {%- set value = part|int -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set _ = result.update({queue_key: value}) -%}
          {%- endfor -%}
          {{ result }}
    
    # 7. 从远程服务器获取历史CSV
    - name: Download historical CSV
      fetch:
        src: "{{ historical_file }}"
        dest: "{{ output_dir }}/temp_{{ inventory_hostname }}_qos.csv"
        flat: yes
      delegate_to: "{{ report_server }}"
      ignore_errors: yes
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 8. 检查历史文件是否存在
    - name: Check if historical file exists locally
      stat:
        path: "{{ output_dir }}/temp_{{ inventory_hostname }}_qos.csv"
      register: file_stat
      delegate_to: localhost
    
    # 9. 分步创建CSV - 避免复杂模板
    - name: Create CSV header
      set_fact:
        csv_header: "Host,Interface,Queue,{{ timestamp_column }}"
      delegate_to: localhost
    
    - name: Generate CSV data rows
      set_fact:
        csv_rows: []
      delegate_to: localhost
    
    - name: Add rows for first interface
      set_fact:
        csv_rows: "{{ csv_rows + interface_rows }}"
      delegate_to: localhost
      vars:
        interface_rows: >-
          {%- set rows = [] -%}
          {%- set intf = '100GE1/1/1' -%}
          {%- for q in range(8) -%}
            {%- set queue = 'queue_' ~ q -%}
            {%- set value = 0 -%}
            {%- if parsed_qos_data[intf] and parsed_qos_data[intf][queue] -%}
              {%- set value = parsed_qos_data[intf][queue] -%}
            {%- endif -%}
            {%- set rows = rows + [inventory_hostname ~ ',' ~ intf ~ ',' ~ queue ~ ',' ~ value] -%}
          {%- endfor -%}
          {{ rows }}
    
    - name: Add rows for second interface
      set_fact:
        csv_rows: "{{ csv_rows + interface_rows }}"
      delegate_to: localhost
      vars:
        interface_rows: >-
          {%- set rows = [] -%}
          {%- set intf = '100GE1/1/2' -%}
          {%- for q in range(8) -%}
            {%- set queue = 'queue_' ~ q -%}
            {%- set value = 0 -%}
            {%- if parsed_qos_data[intf] and parsed_qos_data[intf][queue] -%}
              {%- set value = parsed_qos_data[intf][queue] -%}
            {%- endif -%}
            {%- set rows = rows + [inventory_hostname ~ ',' ~ intf ~ ',' ~ queue ~ ',' ~ value] -%}
          {%- endfor -%}
          {{ rows }}
    
    # 10. 创建CSV文件
    - name: Create CSV file
      copy:
        content: "{{ csv_header }}\n{{ csv_rows | join('\n') }}"
        dest: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        mode: '0644'
      delegate_to: localhost
    
    # 11. 上传到远程
    - name: Upload to remote server
      copy:
        src: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        dest: "{{ historical_file }}"
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ report_server }}"
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 12. 显示结果
    - name: Show result
      debug:
        msg: |
          QoS collection completed for {{ inventory_hostname }}
          File saved to: {{ report_server }}:{{ historical_file }}
