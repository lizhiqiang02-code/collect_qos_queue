---
- name: Collect QoS Queue Dropped Statistics for Huawei Switches
  hosts: all
  gather_facts: no
  vars:
    output_dir: "/runner/project/qos_reports"
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    historical_file: "{{ report_path }}/{{ inventory_hostname }}_qos.csv"
    interfaces:
      - "100GE1/1/1"
      - "100GE1/1/2"
    
  tasks:
    # 1. 获取精确到秒的时间戳
    - name: Get current timestamp
      shell: date +"%Y-%m-%dT%H:%M:%S"
      register: timestamp_cmd
      changed_when: false
      delegate_to: localhost
    
    - name: Set timestamp fact
      set_fact:
        current_timestamp: "{{ timestamp_cmd.stdout }}"
        timestamp_column: "Dropped-{{ timestamp_cmd.stdout }}"
    
    # 2. 创建本地输出目录
    - name: Create output directory
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
    
    # 3. 收集QoS数据
    - name: Collect QoS statistics
      cli_command:
        command: "display qos queue statistics interface {{ item }}"
      register: qos_output
      loop: "{{ interfaces }}"
    
    # 4. 初始化解析数据变量
    - name: Initialize parsed data
      set_fact:
        parsed_qos_data: {}
      delegate_to: localhost
    
    # 5. 解析QoS数据 - 逐个接口处理
    - name: Parse QoS data for first interface
      set_fact:
        parsed_qos_data: "{{ parsed_qos_data | combine({ interface_name: queue_stats }) }}"
      when: qos_output.results|length > 0
      delegate_to: localhost
      vars:
        interface_name: "{{ qos_output.results[0].item }}"
        queue_stats: >-
          {%- set lines = qos_output.results[0].stdout_lines -%}
          {%- set result = {} -%}
          {%- for q in range(8) -%}
            {%- set queue_key = 'queue_' ~ q -%}
            {%- set value = 0 -%}
            {%- for line in lines -%}
              {%- if 'Queue ' ~ q in line -%}
                {%- set parts = line.split() -%}
                {%- for part in parts -%}
                  {%- if part == '0' or part|int > 0 -%}
                    {%- set value = part|int -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set _ = result.update({queue_key: value}) -%}
          {%- endfor -%}
          {{ result }}
    
    # 6. 如果有第二个接口，也解析
    - name: Parse QoS data for second interface
      set_fact:
        parsed_qos_data: "{{ parsed_qos_data | combine({ interface_name: queue_stats }) }}"
      when: qos_output.results|length > 1
      delegate_to: localhost
      vars:
        interface_name: "{{ qos_output.results[1].item }}"
        queue_stats: >-
          {%- set lines = qos_output.results[1].stdout_lines -%}
          {%- set result = {} -%}
          {%- for q in range(8) -%}
            {%- set queue_key = 'queue_' ~ q -%}
            {%- set value = 0 -%}
            {%- for line in lines -%}
              {%- if 'Queue ' ~ q in line -%}
                {%- set parts = line.split() -%}
                {%- for part in parts -%}
                  {%- if part == '0' or part|int > 0 -%}
                    {%- set value = part|int -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set _ = result.update({queue_key: value}) -%}
          {%- endfor -%}
          {{ result }}
    
    # 7. 从远程服务器获取历史CSV
    - name: Download historical CSV
      fetch:
        src: "{{ historical_file }}"
        dest: "{{ output_dir }}/temp_{{ inventory_hostname }}_qos.csv"
        flat: yes
      delegate_to: "{{ report_server }}"
      ignore_errors: yes
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 8. 检查历史文件是否存在
    - name: Check if historical file exists locally
      stat:
        path: "{{ output_dir }}/temp_{{ inventory_hostname }}_qos.csv"
      register: file_stat
      delegate_to: localhost
    
    # 9. 更新CSV文件 - 添加新时间戳列
    - name: Update CSV with new timestamp column
      copy:
        content: |-
          {% if file_stat.stat.exists %}
            {# 读取现有CSV文件 #}
            {% set csv_content = lookup('file', output_dir + '/temp_' + inventory_hostname + '_qos.csv') %}
            {% if csv_content and csv_content.strip() %}
              {# 解析现有CSV #}
              {% set lines = [] %}
              {% for line in csv_content.strip().split('\n') %}
                {% if line.strip() %}
                  {% set lines = lines + [line.strip()] %}
                {% endif %}
              {% endfor %}
              
              {% set header = lines[0] %}
              {% set data_lines = lines[1:] %}
              
              {# 检查是否已有当前时间戳列 #}
              {% set header_parts = header.split(',') %}
              {% set timestamp_exists = false %}
              {% set col_index = -1 %}
              {% for i in range(header_parts|length) %}
                {% if header_parts[i] == timestamp_column %}
                  {% set timestamp_exists = true %}
                  {% set col_index = i %}
                {% endif %}
              {% endfor %}
              
              {# 更新或添加时间戳列 #}
              {% if timestamp_exists %}
                {# 更新现有列 #}
                {{ header }}
                {% for line in data_lines %}
                  {% set row_parts = line.split(',') %}
                  {% if row_parts|length > 2 %}
                    {% set interface = row_parts[1] %}
                    {% set queue = row_parts[2] %}
                    
                    {# 获取当前值 #}
                    {% set current_value = 0 %}
                    {% if parsed_qos_data[interface] and parsed_qos_data[interface][queue] %}
                      {% set current_value = parsed_qos_data[interface][queue] %}
                    {% endif %}
                    
                    {# 更新该列的值 #}
                    {% if col_index < row_parts|length %}
                      {% set row_parts[col_index] = current_value|string %}
                    {% endif %}
                    {{ row_parts|join(',') }}
                  {% endif %}
                {% endfor %}
              {% else %}
                {# 添加新列 #}
                {{ header }},{{ timestamp_column }}
                {% for line in data_lines %}
                  {% set row_parts = line.split(',') %}
                  {% if row_parts|length > 2 %}
                    {% set interface = row_parts[1] %}
                    {% set queue = row_parts[2] %}
                    
                    {# 获取当前值 #}
                    {% set current_value = 0 %}
                    {% if parsed_qos_data[interface] and parsed_qos_data[interface][queue] %}
                      {% set current_value = parsed_qos_data[interface][queue] %}
                    {% endif %}
                    
                    {{ line }},{{ current_value }}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% else %}
              {# 文件为空，创建新文件 #}
              Host,Interface,Queue,{{ timestamp_column }}
              {% for intf in interfaces %}
                {% for q in range(8) %}
                  {% set queue = 'queue_' ~ q %}
                  {% set value = 0 %}
                  {% if parsed_qos_data[intf] and parsed_qos_data[intf][queue] %}
                    {% set value = parsed_qos_data[intf][queue] %}
                  {% endif %}
                  {{ inventory_hostname }},{{ intf }},{{ queue }},{{ value }}
                {% endfor %}
              {% endfor %}
            {% endif %}
          {% else %}
            {# 文件不存在，创建新文件 #}
            Host,Interface,Queue,{{ timestamp_column }}
            {% for intf in interfaces %}
              {% for q in range(8) %}
                {% set queue = 'queue_' ~ q %}
                {% set value = 0 %}
                {% if parsed_qos_data[intf] and parsed_qos_data[intf][queue] %}
                  {% set value = parsed_qos_data[intf][queue] %}
                {% endif %}
                {{ inventory_hostname }},{{ intf }},{{ queue }},{{ value }}
              {% endfor %}
            {% endfor %}
          {% endif %}
        dest: "{{ output_dir }}/{{ inventory_hostname }}_qos_updated.csv"
        mode: '0644'
      delegate_to: localhost
    
    # 10. 添加Dropped-Add列并重新排序
    - name: Add Dropped-Add column and reorder
      copy:
        content: |-
          {% set csv_content = lookup('file', output_dir + '/' + inventory_hostname + '_qos_updated.csv') %}
          {% if csv_content and csv_content.strip() %}
            {# 清理和解析CSV内容 #}
            {% set lines = [] %}
            {% for line in csv_content.strip().split('\n') %}
              {% if line.strip() %}
                {% set lines = lines + [line.strip()] %}
              {% endif %}
            {% endfor %}
            
            {% set header = lines[0] %}
            {% set data_lines = lines[1:] %}
            
            {# 分离基础列和时间戳列 #}
            {% set header_parts = header.split(',') %}
            {% set base_columns = [] %}
            {% set timestamp_columns = [] %}
            {% set timestamp_indices = [] %}
            
            {% for i in range(header_parts|length) %}
              {% if header_parts[i] is search('Dropped-') %}
                {% set timestamp_columns = timestamp_columns + [header_parts[i]] %}
                {% set timestamp_indices = timestamp_indices + [i] %}
              {% else %}
                {% set base_columns = base_columns + [header_parts[i]] %}
              {% endif %}
            {% endfor %}
            
            {# 构建新表头：基础列 + Dropped-Add + 时间戳列 #}
            {% set new_header = base_columns + ['Dropped-Add'] + timestamp_columns %}
            {{ new_header|join(',') }}
            
            {# 处理每一行数据 #}
            {% for line in data_lines %}
              {% if line.strip() %}
                {% set row_parts = line.split(',') %}
                {% set base_values = [] %}
                {% set timestamp_values = [] %}
                
                {# 分离基础值和时间戳值 #}
                {% for i in range(header_parts|length) %}
                  {% if i in timestamp_indices %}
                    {% set val = 0 %}
                    {% if i < row_parts|length %}
                      {% set val = row_parts[i]|default('0')|int %}
                    {% endif %}
                    {% set timestamp_values = timestamp_values + [val] %}
                  {% else %}
                    {% if i < row_parts|length %}
                      {% set base_values = base_values + [row_parts[i]] %}
                    {% else %}
                      {% set base_values = base_values + [''] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                
                {# 计算Dropped-Add：最后两个时间戳的差值 #}
                {% set add_value = 0 %}
                {% if timestamp_values|length >= 2 %}
                  {% set last_val = timestamp_values[-1] %}
                  {% set prev_val = timestamp_values[-2] %}
                  {% set add_value = last_val - prev_val %}
                  {% if add_value < 0 %}
                    {% set add_value = 0 %}
                  {% endif %}
                {% endif %}
                
                {# 构建新行 #}
                {% set new_row = base_values + [add_value|string] %}
                {% for val in timestamp_values %}
                  {% set new_row = new_row + [val|string] %}
                {% endfor %}
                {{ new_row|join(',') }}
              {% endif %}
            {% endfor %}
          {% endif %}
        dest: "{{ output_dir }}/{{ inventory_hostname }}_qos_final.csv"
        mode: '0644'
      delegate_to: localhost
    
    # 11. 上传最终文件到远程服务器
    - name: Upload final CSV to remote server
      copy:
        src: "{{ output_dir }}/{{ inventory_hostname }}_qos_final.csv"
        dest: "{{ historical_file }}"
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ report_server }}"
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 12. 显示结果
    - name: Show result
      debug:
        msg: |
          QoS collection completed for {{ inventory_hostname }}
          File saved to: {{ report_server }}:{{ historical_file }}
          Features:
          - Added new timestamp column: {{ timestamp_column }}
          - Added Dropped-Add column with incremental calculation
          - Updated existing file with new data
