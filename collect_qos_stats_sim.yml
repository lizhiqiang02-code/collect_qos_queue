---
- name: Collect QoS Queue Dropped Statistics for Huawei Switches
  hosts: all
  gather_facts: no
  vars:
    output_dir: "/runner/project/qos_reports"
    historical_file: "/runner/project/historical_{{ inventory_hostname }}.json"
    interfaces:
      - "100GE1/1/1"
      - "100GE1/1/2"
      # 可以添加更多接口
    #timestamp: "{{ ansible_date_time.iso8601 }}"
    
  tasks:
      # 1. 获取时间戳
    - name: Get current timestamp
      ansible.builtin.shell:
        cmd: date -Iseconds
      register: current_time
      changed_when: false
      run_once: yes
      delegate_to: localhost
    
    - name: Set timestamp variable
      ansible.builtin.set_fact:
        timestamp: "{{ current_time.stdout }}"

       # 2. 创建输出目录 
    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

      # 3. 初始化或加载历史数据
    - name: Initialize or load historical data
      block:
        - name: Check if historical file exists
          ansible.builtin.stat:
            path: "{{ historical_file }}"
          register: hist_stat
          delegate_to: localhost
        
        - name: Load historical data if exists
          ansible.builtin.set_fact:
            historical_data: "{{ lookup('file', historical_file) | from_json }}"
          delegate_to: localhost
          when: hist_stat.stat.exists
        
        - name: Initialize empty historical data
          ansible.builtin.set_fact:
            historical_data: {}
          when: not hist_stat.stat.exists
      
      run_once: yes

      # 4. 初始化 CSV 数据
    - name: Initialize CSV data list
      ansible.builtin.set_fact:
        csv_data: []
      delegate_to: localhost

      # 5. 处理每个接口
    - name: Process each interface
      include_tasks: process_interface_tasks.yml
      loop: "{{ interfaces }}"
      loop_control:
        loop_var: interface

      # 6. 创建 CSV 文件
    - name: Create CSV file with header
      ansible.builtin.copy:
        content: >-
          "Host","Interface","Queue","Dropped","Dropped-Add","Timestamp"
          {{ csv_data | join("\\n")}}
        dest: "{{ output_dir }}/{{ inventory_hostname }}_qos_{{ lookup('pipe', 'date +%Y-%m-%d') }}.csv"
        mode: '0644'
      delegate_to: localhost

      # 7. 更新历史数据
    - name: Update historical data for next run
      ansible.builtin.set_fact:
        new_historical_data: "{{ historical_data }}"
      delegate_to: localhost
      run_once: yes

      # 8. 显示完成信息
    - name: Save current values as historical
      ansible.builtin.copy:
        content: "{{ new_historical_data | to_json }}"
        dest: "{{ historical_file }}"
        mode: '0644'
      delegate_to: localhost
    
    - name: Display completion message
      debug:
        msg: "Data collected and saved to {{ output_dir }}/{{ inventory_hostname }}_qos_{{ lookup('pipe', 'date +%Y-%m-%d') }}.csv"

    # 8. 将报告传输到远程服务器 172.20.149.118
    - name: Transfer CSV report to remote server 172.20.149.118
      ansible.builtin.copy:
        src: "{{ output_dir }}/{{ inventory_hostname }}_qos_{{ lookup('pipe', 'date +%Y-%m-%d') }}.csv"
        dest: "/root/qos_reports/{{ inventory_hostname }}_qos_{{ lookup('pipe', 'date +%Y-%m-%d') }}.csv"
        owner: root
        group: root
        mode: '0644'
      delegate_to: 172.20.149.118
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV" 
        ansible_ssh_host: 172.20.149.118
