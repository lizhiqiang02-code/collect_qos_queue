---
- name: Collect QoS Queue Dropped Statistics for Huawei Switches
  hosts: all
  gather_facts: no
  vars:
    output_dir: "/runner/project/qos_reports"
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    historical_file: "{{ report_path }}/{{ inventory_hostname }}_qos.csv"
    interfaces:
      - "100GE1/1/1"
      - "100GE1/1/2"
      # 可以添加更多接口
    
  tasks:
    # 1. 获取精确到秒的时间戳
    - name: Get current timestamp with seconds precision
      ansible.builtin.shell:
        cmd: date +"%Y-%m-%dT%H:%M:%S"
      register: current_time
      changed_when: false
      run_once: yes
      delegate_to: localhost
    
    - name: Set timestamp variables
      ansible.builtin.set_fact:
        timestamp: "{{ current_time.stdout }}"
        timestamp_col: "Dropped-{{ current_time.stdout }}"
    
    # 2. 创建本地输出目录
    - name: Create local output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
    
    # 3. 获取当前QoS数据
    - name: Get QoS statistics for all interfaces
      ansible.netcommon.cli_command:
        command: "display qos queue statistics interface {{ item }}"
      register: qos_results
      loop: "{{ interfaces }}"
      loop_control:
        loop_var: interface_item
    
    # 替换第4个任务为这个更简单的方法
    - name: Parse QoS statistics with simple method
      ansible.builtin.set_fact:
        current_qos_data: "{{ current_qos_data | default({}) | combine({ item.interface_item: item_stats }) }}"
      loop: "{{ qos_results.results }}"
      loop_control:
        loop_var: item
      vars:
        item_stats: >-
          {%- set result = {} -%}
          {%- for i in range(0, 8) -%}
            {%- set queue_key = 'queue_' ~ i -%}
            {%- set queue_line = '' -%}
            {%- for line in item.stdout_lines -%}
              {%- if line is match('.*Queue\s+' ~ i ~ '.*') -%}
                {%- set queue_line = line -%}
                {%- break -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if queue_line -%}
              {%- set parts = queue_line.split() -%}
              {%- set dropped_value = parts[-1] | int -%}
              {%- set _ = result.update({queue_key: dropped_value}) -%}
            {%- else -%}
              {%- set _ = result.update({queue_key: 0}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}
    
    # 5. 从远程服务器获取历史CSV文件
    - name: Download historical CSV file from remote server
      ansible.builtin.fetch:
        src: "{{ historical_file }}"
        dest: "{{ output_dir }}/temp_{{ inventory_hostname }}_qos.csv"
        flat: yes
      delegate_to: "{{ report_server }}"
      ignore_errors: yes
      register: download_result
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 6. 检查下载是否成功
    - name: Check if historical CSV exists
      ansible.builtin.set_fact:
        csv_exists: "{{ download_result is success and download_result.failed == false }}"
      delegate_to: localhost
    
    # 7. 处理CSV数据
    - name: Generate CSV content
      ansible.builtin.set_fact:
        updated_csv_content: "{{ csv_result }}"
      delegate_to: localhost
      vars:
        csv_result: |
          {% if csv_exists %}
            {% set csv_data = lookup('file', output_dir + '/temp_' + inventory_hostname + '_qos.csv') %}
            {% if csv_data and csv_data.strip() %}
              {# 情况A: 已有CSV文件，需要更新 #}
              {% set lines = csv_data.strip().split('\n') %}
              {% set header = lines[0].split(',') %}
              {% set data_rows = lines[1:] %}
              
              {# 检查是否已存在当前时间戳的列 #}
              {% set timestamp_exists = false %}
              {% set timestamp_col_index = -1 %}
              {% for i in range(header|length) %}
                {% if header[i] == timestamp_col %}
                  {% set timestamp_exists = true %}
                  {% set timestamp_col_index = i %}
                {% endif %}
              {% endfor %}
              
              {# 更新或添加时间戳列 #}
              {% if timestamp_exists %}
                {# 更新现有列 #}
                {% set new_header = header %}
                {% set new_data_rows = [] %}
                
                {% for row in data_rows %}
                  {% if row.strip() %}
                    {% set row_data = row.split(',') %}
                    {% set host = row_data[0] %}
                    {% set interface = row_data[1] %}
                    {% set queue = row_data[2] %}
                    
                    {# 获取新的dropped值 #}
                    {% set new_dropped = 0 %}
                    {% if current_qos_data.get(interface) %}
                      {% set new_dropped = current_qos_data[interface].get(queue, 0) %}
                    {% endif %}
                    
                    {# 更新该列的值 #}
                    {% if row_data|length > timestamp_col_index %}
                      {% set row_data = row_data[:timestamp_col_index] + [new_dropped|string] + row_data[timestamp_col_index+1:] %}
                    {% else %}
                      {# 如果行数据少于列数，补齐 #}
                      {% for i in range(row_data|length, timestamp_col_index + 1) %}
                        {% if i == timestamp_col_index %}
                          {% set row_data = row_data + [new_dropped|string] %}
                        {% else %}
                          {% set row_data = row_data + [''] %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                    
                    {{ row_data|join(',') }}
                  {% endif %}
                {% endfor %}
                
                {{ new_header|join(',') }}
                {% for row in new_data_rows %}
                {{ row }}
                {% endfor %}
              {% else %}
                {# 添加新的时间戳列 #}
                {% set new_header = header + [timestamp_col] %}
                {% set new_data_rows = [] %}
                
                {% for row in data_rows %}
                  {% if row.strip() %}
                    {% set row_data = row.split(',') %}
                    {% set host = row_data[0] %}
                    {% set interface = row_data[1] %}
                    {% set queue = row_data[2] %}
                    
                    {# 获取新的dropped值 #}
                    {% set new_dropped = 0 %}
                    {% if current_qos_data.get(interface) %}
                      {% set new_dropped = current_qos_data[interface].get(queue, 0) %}
                    {% endif %}
                    
                    {% set row_data = row_data + [new_dropped|string] %}
                    {{ row_data|join(',') }}
                  {% endif %}
                {% endfor %}
                
                {{ new_header|join(',') }}
                {% for row in new_data_rows %}
                {{ row }}
                {% endfor %}
              {% endif %}
            {% else %}
              {# CSV文件为空，当作新文件处理 #}
              {% set csv_exists = false %}
            {% endif %}
          {% endif %}
          
          {% if not csv_exists %}
            {# 情况B: 没有CSV文件，创建新的 #}
            {% set new_header = ['Host', 'Interface', 'Queue', timestamp_col] %}
            
            {# 生成数据行 #}
            {% set new_data_rows = [] %}
            {% for interface in interfaces %}
              {% for i in range(0, 8) %}
                {% set queue_key = 'queue_' ~ i %}
                {% set dropped_value = 0 %}
                {% if current_qos_data.get(interface) %}
                  {% set dropped_value = current_qos_data[interface].get(queue_key, 0) %}
                {% endif %}
                {{ [inventory_hostname, interface, queue_key, dropped_value]|join(',') }}
              {% endfor %}
            {% endfor %}
            
            {{ new_header|join(',') }}
            {% for row in new_data_rows %}
            {{ row }}
            {% endfor %}
          {% endif %}
    
    # 8. 计算Dropped-Add列并重新组织列顺序
    - name: Calculate Dropped-Add and reorder columns
      ansible.builtin.set_fact:
        final_csv: "{{ final_csv_content }}"
      delegate_to: localhost
      vars:
        final_csv_content: |
          {% set lines = updated_csv_content.strip().split('\n') %}
          {% set header = lines[0].split(',') %}
          {% set data_rows = lines[1:] %}
          
          {# 提取时间戳列 #}
          {% set timestamp_cols = [] %}
          {% set timestamp_indices = [] %}
          {% for i in range(header|length) %}
            {% if header[i] starts with 'Dropped-' %}
              {% set timestamp_cols = timestamp_cols + [header[i]] %}
              {% set timestamp_indices = timestamp_indices + [i] %}
            {% endif %}
          {% endfor %}
          
          {# 构建新表头：基础列 + Dropped-Add + 时间戳列 #}
          {% set new_header = ['Host', 'Interface', 'Queue', 'Dropped-Add'] %}
          {% for col in timestamp_cols %}
            {% set new_header = new_header + [col] %}
          {% endfor %}
          
          {% set new_data_rows = [] %}
          {% for row in data_rows %}
            {% if row.strip() %}
              {% set row_data = row.split(',') %}
              {% set host = row_data[0] %}
              {% set interface = row_data[1] %}
              {% set queue = row_data[2] %}
              
              {# 提取时间戳列的值 #}
              {% set timestamp_values = [] %}
              {% for idx in timestamp_indices %}
                {% if idx < row_data|length %}
                  {% set timestamp_values = timestamp_values + [row_data[idx]|default('0')|int] %}
                {% else %}
                  {% set timestamp_values = timestamp_values + [0] %}
                {% endif %}
              {% endfor %}
              
              {# 计算Dropped-Add：最后两个时间戳的差值 #}
              {% set add_value = 0 %}
              {% if timestamp_values|length >= 2 %}
                {% set last_val = timestamp_values[-1] %}
                {% set prev_val = timestamp_values[-2] %}
                {% set add_value = last_val - prev_val %}
                {% if add_value < 0 %}
                  {% set add_value = 0 %}
                {% endif %}
              {% endif %}
              
              {# 构建新行 #}
              {% set new_row = [host, interface, queue, add_value] %}
              {% for val in timestamp_values %}
                {% set new_row = new_row + [val] %}
              {% endfor %}
              
              {{ new_row|join(',') }}
            {% endif %}
          {% endfor %}
          
          {{ new_header|join(',') }}
          {% for row in new_data_rows %}
          {{ row }}
          {% endfor %}
    
    # 9. 保存CSV文件到本地
    - name: Save CSV file locally
      ansible.builtin.copy:
        content: "{{ final_csv }}"
        dest: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        mode: '0644'
      delegate_to: localhost
    
    # 10. 上传CSV文件到远程服务器
    - name: Upload updated CSV to remote server
      ansible.builtin.copy:
        src: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        dest: "{{ historical_file }}"
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ report_server }}"
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 11. 显示完成信息
    - name: Display completion message
      debug:
        msg: |
          QoS data collected and saved:
          - Local: {{ output_dir }}/{{ inventory_hostname }}_qos.csv
          - Remote: {{ report_server }}:{{ historical_file }}
          - Status: {{ 'Updated existing CSV file' if csv_exists else 'Created new CSV file' }}
