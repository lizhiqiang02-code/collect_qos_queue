---
- name: Collect QoS Queue Dropped Statistics for Huawei Switches
  hosts: all
  gather_facts: no
  vars:
    output_dir: "/runner/project/qos_reports"
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    historical_file: "{{ report_path }}/{{ inventory_hostname }}_qos.csv"
    interfaces:
      - "100GE1/1/1"
      - "100GE1/1/2"
    
  tasks:
    # 1. 获取精确到秒的时间戳
    - name: Get current timestamp
      shell: date +"%Y-%m-%dT%H:%M:%S"
      register: timestamp_cmd
      changed_when: false
      delegate_to: localhost
    
    - name: Set timestamp fact
      set_fact:
        current_timestamp: "{{ timestamp_cmd.stdout }}"
        timestamp_column: "Dropped-{{ timestamp_cmd.stdout }}"
    
    # 2. 创建本地输出目录
    - name: Create output directory
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
    
    # 3. 收集QoS数据
    - name: Collect QoS statistics
      cli_command:
        command: "display qos queue statistics interface {{ item }}"
      register: qos_output
      loop: "{{ interfaces }}"
    
    # 4. 初始化解析数据变量
    - name: Initialize parsed data
      set_fact:
        parsed_qos_data: {}
      delegate_to: localhost
    
    # 5. 解析QoS数据（简化的解析逻辑）
    - name: Parse QoS data line by line
      set_fact:
        parsed_qos_data: "{{ parsed_qos_data | combine({ interface_name: parse_qos_lines(qos_result.stdout_lines) }) }}"
      loop: "{{ qos_output.results }}"
      delegate_to: localhost
      vars:
        interface_name: "{{ qos_result.item }}"
        qos_result: "{{ item }}"
        parse_qos_lines: |
          {% macro parse(lines) %}
            {% set result = {} %}
            {% for q in range(8) %}
              {% set queue_key = 'queue_' ~ q %}
              {% set value = 0 %}
              {% for line in lines %}
                {% if line is search('Queue ' ~ q) %}
                  {% set parts = line.split() %}
                  {% for part in parts %}
                    {% if part is match('^[0-9]+$') %}
                      {% set value = part|int %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
              {% endfor %}
              {% set _ = result.update({queue_key: value}) %}
            {% endfor %}
            {{ result }}
          {% endmacro %}
          {{ parse(qos_result.stdout_lines) }}
    
    # 6. 从远程服务器获取历史CSV
    - name: Download historical CSV
      fetch:
        src: "{{ historical_file }}"
        dest: "{{ output_dir }}/temp_{{ inventory_hostname }}_qos.csv"
        flat: yes
      delegate_to: "{{ report_server }}"
      ignore_errors: yes
      register: download_status
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 7. 检查历史文件是否存在
    - name: Check if historical file exists locally
      stat:
        path: "{{ output_dir }}/temp_{{ inventory_hostname }}_qos.csv"
      register: file_stat
      delegate_to: localhost
    
    # 8. 生成CSV内容 - 完全使用字符串拼接
    - name: Generate CSV content using string concatenation
      set_fact:
        csv_output: "{{ generate_csv_string() }}"
      delegate_to: localhost
      vars:
        generate_csv_string: |
          {% macro generate() %}
            {% if file_stat.stat.exists %}
              {% set csv_content = lookup('file', output_dir + '/temp_' + inventory_hostname + '_qos.csv') %}
              {% if csv_content and csv_content.strip() %}
                {% set lines = csv_content.strip().split('\n') %}
                {% set header_line = lines[0] %}
                {% set data_lines = lines[1:] %}
                
                {# 检查是否已有当前时间戳列 #}
                {% set header_parts = header_line.split(',') %}
                {% set col_exists = false %}
                {% for header_part in header_parts %}
                  {% if header_part == timestamp_column %}
                    {% set col_exists = true %}
                  {% endif %}
                {% endfor %}
                
                {# 输出表头 #}
                {% if col_exists %}
                  {{ header_line }}
                {% else %}
                  {{ header_line }},{{ timestamp_column }}
                {% endif %}
                
                {# 处理数据行 #}
                {% for line in data_lines %}
                  {% if line.strip() %}
                    {% set row_parts = line.split(',') %}
                    {% set interface_name = row_parts[1] %}
                    {% set queue_name = row_parts[2] %}
                    
                    {# 获取新值 #}
                    {% set new_value = 0 %}
                    {% if parsed_qos_data[interface_name] and parsed_qos_data[interface_name][queue_name] %}
                      {% set new_value = parsed_qos_data[interface_name][queue_name] %}
                    {% endif %}
                    
                    {# 添加或更新列 #}
                    {% if col_exists %}
                      {# 需要更新现有列的值 #}
                      {% set column_index = -1 %}
                      {% for i in range(header_parts|length) %}
                        {% if header_parts[i] == timestamp_column %}
                          {% set column_index = i %}
                        {% endif %}
                      {% endfor %}
                      
                      {% if column_index >= 0 and column_index < row_parts|length %}
                        {% set row_parts[column_index] = new_value|string %}
                      {% endif %}
                      {{ row_parts|join(',') }}
                    {% else %}
                      {# 添加新列 #}
                      {{ line }},{{ new_value }}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% else %}
                {# 文件为空，创建新CSV #}
                Host,Interface,Queue,{{ timestamp_column }}
                {% for intf in interfaces %}
                  {% for q in range(8) %}
                    {% set queue = 'queue_' ~ q %}
                    {% set value = 0 %}
                    {% if parsed_qos_data[intf] and parsed_qos_data[intf][queue] %}
                      {% set value = parsed_qos_data[intf][queue] %}
                    {% endif %}
                    {{ inventory_hostname }},{{ intf }},{{ queue }},{{ value }}
                  {% endfor %}
                {% endfor %}
              {% endif %}
            {% else %}
              {# 文件不存在，创建新CSV #}
              Host,Interface,Queue,{{ timestamp_column }}
              {% for intf in interfaces %}
                {% for q in range(8) %}
                  {% set queue = 'queue_' ~ q %}
                  {% set value = 0 %}
                  {% if parsed_qos_data[intf] and parsed_qos_data[intf][queue] %}
                    {% set value = parsed_qos_data[intf][queue] %}
                  {% endif %}
                  {{ inventory_hostname }},{{ intf }},{{ queue }},{{ value }}
                {% endfor %}
              {% endfor %}
            {% endif %}
          {% endmacro %}
          {{ generate() }}
    
    # 9. 处理最终CSV - 简化版本，只添加列不计算增量
    - name: Create final CSV (simplified)
      set_fact:
        final_csv_content: "{{ csv_output }}"
      delegate_to: localhost
    
    # 10. 保存到本地
    - name: Save CSV locally
      copy:
        content: "{{ final_csv_content }}"
        dest: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        mode: '0644'
      delegate_to: localhost
    
    # 11. 上传到远程
    - name: Upload to remote server
      copy:
        src: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        dest: "{{ historical_file }}"
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ report_server }}"
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 12. 显示结果
    - name: Show result
      debug:
        msg: |
          QoS collection completed for {{ inventory_hostname }}
          File saved to: {{ report_server }}:{{ historical_file }}
