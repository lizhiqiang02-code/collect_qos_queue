---
- name: Simple QoS CSV Update with Auto-Create
  hosts: all
  gather_facts: no
  vars:
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    historical_file: "{{ report_path }}/{{ inventory_hostname }}_qos.csv"
    interfaces:
      - "100GE1/1/1"
      - "100GE1/1/2"
      - "25GE1/1/1"
      - "25GE1/1/2"
      - "25GE1/1/3"
      - "25GE1/1/4"
      - "25GE1/1/5"
  
  tasks:
    # 1. 获取当前时间戳
    - name: Get current timestamp
      shell: date +"%Y-%m-%dT%H:%M:%S"
      register: current_ts
      delegate_to: localhost
    
    - name: Set timestamp facts
      set_fact:
        new_timestamp: "{{ current_ts.stdout }}"
        new_column: "Dropped-{{ current_ts.stdout }}"
    
    # 2. 收集当前QoS数据
    - name: Collect QoS statistics
      cli_command:
        command: "display qos queue statistics interface {{ item }}"
      register: qos_results
      loop: "{{ interfaces }}"
    
    # 3. 创建Python脚本处理所有逻辑
    - name: Create Python script
      copy:
        content: |
          #!/usr/bin/env python3
          import csv
          import re
          import sys
          import os
          
          def parse_qos_output(output):
              """解析QoS输出，返回队列数据字典"""
              result = {}
              for q in range(8):
                  queue_key = f'queue_{q}'
                  value = 0
                  for line in output.split('\n'):
                      if f'Queue {q}' in line:
                          numbers = re.findall(r'\b\d+\b', line)
                          if numbers:
                              value = int(numbers[-1])
                          break
                  result[queue_key] = value
              return result
          
          def create_new_csv(hostname, interfaces, qos_data, new_column):
              """创建新的CSV文件"""
              headers = ["Host", "Interface", "Queue", "Dropped-Add", new_column]
              rows = [headers]
              
              for interface in interfaces:
                  for q in range(8):
                      queue = f"queue_{q}"
                      value = qos_data.get(interface, {}).get(queue, 0)
                      rows.append([hostname, interface, queue, "0", str(value)])
              
              return rows
          
          def update_existing_csv(rows, interfaces, qos_data, new_column):
              """更新现有的CSV文件"""
              # 添加新列到表头
              rows[0].append(new_column)
              
              # 更新数据行
              for i in range(1, len(rows)):
                  if len(rows[i]) >= 3:
                      interface = rows[i][1].strip()
                      queue = rows[i][2].strip()
                      
                      value = "0"
                      if interface in qos_data and queue in qos_data[interface]:
                          value = str(qos_data[interface][queue])
                      
                      rows[i].append(value)
              
              # 计算Dropped-Add列
              if len(rows[0]) >= 5:
                  timestamp_indices = []
                  for idx, header in enumerate(rows[0]):
                      if 'Dropped-' in header and header != 'Dropped-Add':
                          timestamp_indices.append(idx)
                  
                  if len(timestamp_indices) >= 2:
                      for i in range(1, len(rows)):
                          if len(rows[i]) > max(timestamp_indices[-1], timestamp_indices[-2]):
                              try:
                                  last_val = int(rows[i][timestamp_indices[-1]])
                                  prev_val = int(rows[i][timestamp_indices[-2]])
                                  diff = max(0, last_val - prev_val)
                                  if len(rows[i]) > 3:
                                      rows[i][3] = str(diff)
                              except ValueError:
                                  pass
              
              return rows
          
          def main():
              if len(sys.argv) < 8:
                  print("用法: python3 script.py <hostname> <server> <user> <password> <path> <new_column> <qos1> <qos2>")
                  sys.exit(1)
              
              hostname = sys.argv[1]
              server = sys.argv[2]
              user = sys.argv[3]
              password = sys.argv[4]
              remote_path = sys.argv[5]
              new_column = sys.argv[6]
              
              # 解析QoS数据
              interfaces = ["100GE1/1/1", "100GE1/1/2", "25GE1/1/1", "25GE1/1/2"]
              qos_data = {}
              
              for i, interface in enumerate(interfaces):
                  if i + 7 < len(sys.argv):
                      output = sys.argv[i + 7].replace('\\n', '\n')
                      qos_data[interface] = parse_qos_output(output)
              
              print(f"解析的QoS数据: {qos_data}")
              
              # 尝试使用ssh命令获取文件
              import subprocess
              
              # 首先检查文件是否存在
              check_cmd = f"sshpass -p '{password}' ssh -o StrictHostKeyChecking=no {user}@{server} 'test -f {remote_path} && echo exists || echo not_exists'"
              
              try:
                  result = subprocess.run(check_cmd, shell=True, capture_output=True, text=True)
                  file_exists = "exists" in result.stdout.strip()
                  print(f"文件存在检查: {result.stdout.strip()}")
              except Exception as e:
                  print(f"检查文件存在时出错: {e}")
                  file_exists = False
              
              if not file_exists:
                  print(f"文件不存在，创建新文件: {remote_path}")
                  rows = create_new_csv(hostname, interfaces, qos_data, new_column)
              else:
                  print(f"文件存在，下载并更新: {remote_path}")
                  # 下载文件
                  download_cmd = f"sshpass -p '{password}' scp -o StrictHostKeyChecking=no {user}@{server}:{remote_path} /tmp/temp_qos.csv"
                  try:
                      subprocess.run(download_cmd, shell=True, check=True)
                      
                      # 读取文件
                      rows = []
                      with open('/tmp/temp_qos.csv', 'r') as f:
                          for line in f:
                              if line.strip():
                                  cleaned = [field.strip() for field in line.split(',')]
                                  rows.append(cleaned)
                      
                      rows = update_existing_csv(rows, interfaces, qos_data, new_column)
                      
                  except Exception as e:
                      print(f"下载或读取文件时出错: {e}")
                      # 如果出错，也创建新文件
                      rows = create_new_csv(hostname, interfaces, qos_data, new_column)
              
              # 保存到本地临时文件
              temp_file = '/tmp/qos_updated.csv'
              with open(temp_file, 'w', newline='') as f:
                  writer = csv.writer(f)
                  writer.writerows(rows)
              
              # 上传到远程服务器
              upload_cmd = f"sshpass -p '{password}' scp -o StrictHostKeyChecking=no {temp_file} {user}@{server}:{remote_path}"
              try:
                  subprocess.run(upload_cmd, shell=True, check=True)
                  print(f"成功上传文件到: {server}:{remote_path}")
                  
                  # 显示文件内容预览
                  print("\n文件内容预览:")
                  print("=" * 50)
                  for i, row in enumerate(rows[:5]):  # 只显示前5行
                      print(','.join(row))
                  if len(rows) > 5:
                      print("...")
                  print(f"总共 {len(rows)} 行")
                  print("=" * 50)
                  
              except Exception as e:
                  print(f"上传文件时出错: {e}")
                  sys.exit(1)
          
          if __name__ == "__main__":
              main()
        dest: "/tmp/update_qos_final.py"
        mode: '0755'
      delegate_to: localhost
    
    # 4. 运行Python脚本
    - name: Run update script
      shell: |
        python3 /tmp/update_qos_final.py \
          "{{ inventory_hostname }}" \
          "{{ report_server }}" \
          "root" \
          "3edc\$RFV" \
          "{{ historical_file }}" \
          "{{ new_column }}" \
          "{{ qos_results.results[0].stdout | replace('\n', '\\n') | replace('"', '\\"') }}" \
          "{{ qos_results.results[1].stdout | replace('\n', '\\n') | replace('"', '\\"') }}"
      args:
        executable: /bin/bash
      register: script_result
      delegate_to: localhost
    
    # 5. 显示脚本输出
    - name: Show script output
      debug:
        var: script_result.stdout_lines
    
    # 6. 显示完成消息
    - name: Show completion message
      debug:
        msg: |
          QoS CSV更新完成！
          - 设备: {{ inventory_hostname }}
          - 新时间戳: {{ new_timestamp }}
          - 新列名: {{ new_column }}
          - 文件位置: {{ report_server }}:{{ historical_file }}
