---
- name: Collect QoS Queue Dropped Statistics for Huawei Switches
  hosts: all
  gather_facts: no
  vars:
    output_dir: "/runner/project/qos_reports"
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    historical_file: "{{ report_path }}/{{ inventory_hostname }}_qos.csv"
    interfaces:
      - "100GE1/1/1"
      - "100GE1/1/2"
    
  tasks:
    # 1. 获取精确到秒的时间戳
    - name: Get current timestamp
      shell: date +"%Y-%m-%dT%H:%M:%S"
      register: timestamp_cmd
      changed_when: false
      delegate_to: localhost
    
    - name: Set timestamp fact
      set_fact:
        current_timestamp: "{{ timestamp_cmd.stdout }}"
        timestamp_column: "Dropped-{{ timestamp_cmd.stdout }}"
    
    # 2. 创建本地输出目录
    - name: Create output directory
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
    
    # 3. 收集QoS数据
    - name: Collect QoS statistics
      cli_command:
        command: "display qos queue statistics interface {{ item }}"
      register: qos_output
      loop: "{{ interfaces }}"
    
    # 4. 初始化解析数据变量
    - name: Initialize parsed data
      set_fact:
        parsed_qos_data: {}
      delegate_to: localhost
    
    # 5. 解析QoS数据 - 不使用宏，直接内联处理
    - name: Parse QoS data for each interface
      set_fact:
        parsed_qos_data: "{{ parsed_qos_data | combine({ qos_result.item: queue_stats }) }}"
      loop: "{{ qos_output.results }}"
      delegate_to: localhost
      vars:
        qos_result: "{{ item }}"
        queue_stats: >-
          {%- set lines = qos_result.stdout_lines -%}
          {%- set result = {} -%}
          {%- for q in range(8) -%}
            {%- set queue_key = 'queue_' ~ q -%}
            {%- set value = 0 -%}
            {%- for line in lines -%}
              {%- if 'Queue ' ~ q in line -%}
                {%- set parts = line.split() -%}
                {%- for part in parts -%}
                  {%- if part == '0' or part|int > 0 -%}
                    {%- set value = part|int -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set _ = result.update({queue_key: value}) -%}
          {%- endfor -%}
          {{ result }}
    
    # 6. 从远程服务器获取历史CSV
    - name: Download historical CSV
      fetch:
        src: "{{ historical_file }}"
        dest: "{{ output_dir }}/temp_{{ inventory_hostname }}_qos.csv"
        flat: yes
      delegate_to: "{{ report_server }}"
      ignore_errors: yes
      register: download_status
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 7. 检查历史文件是否存在
    - name: Check if historical file exists locally
      stat:
        path: "{{ output_dir }}/temp_{{ inventory_hostname }}_qos.csv"
      register: file_stat
      delegate_to: localhost
    
    # 8. 生成CSV内容 - 简单版本
    - name: Generate CSV content
      set_fact:
        csv_lines: []
      delegate_to: localhost
    
    - name: Build CSV header
      set_fact:
        csv_header: "{{ build_header() }}"
      delegate_to: localhost
      vars:
        build_header: |
          {% if file_stat.stat.exists %}
            {% set csv_content = lookup('file', output_dir + '/temp_' + inventory_hostname + '_qos.csv') %}
            {% if csv_content and csv_content.strip() %}
              {% set lines = csv_content.strip().split('\n') %}
              {% set header_line = lines[0] %}
              {% set header_parts = header_line.split(',') %}
              {% set has_column = false %}
              {% for part in header_parts %}
                {% if part == timestamp_column %}
                  {% set has_column = true %}
                {% endif %}
              {% endfor %}
              {% if has_column %}
                {{ header_line }}
              {% else %}
                {{ header_line }},{{ timestamp_column }}
              {% endif %}
            {% else %}
              Host,Interface,Queue,{{ timestamp_column }}
            {% endif %}
          {% else %}
            Host,Interface,Queue,{{ timestamp_column }}
          {% endif %}
    
    - name: Build CSV data rows
      set_fact:
        csv_data: "{{ build_data_rows() }}"
      delegate_to: localhost
      vars:
        build_data_rows: |
          {% if file_stat.stat.exists %}
            {% set csv_content = lookup('file', output_dir + '/temp_' + inventory_hostname + '_qos.csv') %}
            {% if csv_content and csv_content.strip() %}
              {% set lines = csv_content.strip().split('\n') %}
              {% set header_line = lines[0] %}
              {% set data_lines = lines[1:] %}
              {% set header_parts = header_line.split(',') %}
              {% set has_column = false %}
              {% set column_index = -1 %}
              {% for i in range(header_parts|length) %}
                {% if header_parts[i] == timestamp_column %}
                  {% set has_column = true %}
                  {% set column_index = i %}
                {% endif %}
              {% endfor %}
              
              {% set output = [] %}
              {% for line in data_lines %}
                {% if line.strip() %}
                  {% set row_parts = line.split(',') %}
                  {% set interface_name = row_parts[1] %}
                  {% set queue_name = row_parts[2] %}
                  
                  {# 获取新值 #}
                  {% set new_value = 0 %}
                  {% if parsed_qos_data[interface_name] and parsed_qos_data[interface_name][queue_name] %}
                    {% set new_value = parsed_qos_data[interface_name][queue_name] %}
                  {% endif %}
                  
                  {% if has_column and column_index >= 0 %}
                    {# 更新现有列 #}
                    {% if column_index < row_parts|length %}
                      {% set row_parts[column_index] = new_value|string %}
                    {% endif %}
                    {% set output = output + [row_parts|join(',')] %}
                  {% else %}
                    {# 添加新列 #}
                    {% set output = output + [line ~ ',' ~ new_value] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ output|join('\n') }}
            {% else %}
              {# 文件为空 #}
              {% set output = [] %}
              {% for intf in interfaces %}
                {% for q in range(8) %}
                  {% set queue = 'queue_' ~ q %}
                  {% set value = 0 %}
                  {% if parsed_qos_data[intf] and parsed_qos_data[intf][queue] %}
                    {% set value = parsed_qos_data[intf][queue] %}
                  {% endif %}
                  {% set output = output + [inventory_hostname ~ ',' ~ intf ~ ',' ~ queue ~ ',' ~ value] %}
                {% endfor %}
              {% endfor %}
              {{ output|join('\n') }}
            {% endif %}
          {% else %}
            {# 文件不存在 #}
            {% set output = [] %}
            {% for intf in interfaces %}
              {% for q in range(8) %}
                {% set queue = 'queue_' ~ q %}
                {% set value = 0 %}
                {% if parsed_qos_data[intf] and parsed_qos_data[intf][queue] %}
                  {% set value = parsed_qos_data[intf][queue] %}
                {% endif %}
                {% set output = output + [inventory_hostname ~ ',' ~ intf ~ ',' ~ queue ~ ',' ~ value] %}
              {% endfor %}
            {% endfor %}
            {{ output|join('\n') }}
          {% endif %}
    
    # 9. 组合CSV
    - name: Combine CSV
      set_fact:
        csv_output: "{{ csv_header }}\n{{ csv_data }}"
      delegate_to: localhost
    
    # 10. 保存到本地
    - name: Save CSV locally
      copy:
        content: "{{ csv_output }}"
        dest: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        mode: '0644'
      delegate_to: localhost
    
    # 11. 上传到远程
    - name: Upload to remote server
      copy:
        src: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        dest: "{{ historical_file }}"
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ report_server }}"
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 12. 显示结果
    - name: Show result
      debug:
        msg: |
          QoS collection completed for {{ inventory_hostname }}
          File saved to: {{ report_server }}:{{ historical_file }}
