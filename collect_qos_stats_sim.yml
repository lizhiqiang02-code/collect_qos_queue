---
- name: QoS Collection with File Update
  hosts: all
  gather_facts: no
  vars:
    output_dir: "/runner/project/qos_reports"
    report_server: "172.20.149.118"
    report_path: "/root/qos_reports"
    historical_file: "{{ report_path }}/{{ inventory_hostname }}_qos.csv"
  
  tasks:
    # 1. 获取时间戳
    - name: Get timestamp
      shell: date +"%Y-%m-%dT%H:%M:%S"
      register: ts
      delegate_to: localhost
    
    - name: Set column name
      set_fact:
        new_column: "Dropped-{{ ts.stdout }}"
    
    # 2. 收集数据
    - name: Collect QoS data
      cli_command:
        command: "display qos queue statistics interface 100GE1/1/1"
      register: qos_data
    
    # 3. 下载现有文件
    - name: Download existing CSV
      fetch:
        src: "{{ historical_file }}"
        dest: "{{ output_dir }}/existing_{{ inventory_hostname }}_qos.csv"
        flat: yes
      delegate_to: "{{ report_server }}"
      ignore_errors: yes
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
    
    # 4. 检查文件是否存在
    - name: Check file existence
      stat:
        path: "{{ output_dir }}/existing_{{ inventory_hostname }}_qos.csv"
      register: file_check
      delegate_to: localhost
    
    # 5. 创建或更新CSV
    - name: Create or update CSV
      copy:
        content: |-
          {% if file_check.stat.exists %}
            {# 读取现有文件 #}
            {% set existing = lookup('file', output_dir + '/existing_' + inventory_hostname + '_qos.csv') %}
            {% if existing and existing.strip() %}
              {% set lines = existing.strip().split('\n') %}
              {% set header = lines[0] %}
              {% set data = lines[1:] %}
              
              {# 检查是否已有该列 #}
              {% if new_column in header %}
                {{ header }}
                {% for line in data %}
                  {% set row = line.split(',') %}
                  {% set interface = row[1] %}
                  {% set queue = row[2] %}
                  
                  {# 获取新值 #}
                  {% set new_value = 0 %}
                  {% for q in range(8) %}
                    {% if queue == 'queue_' ~ q %}
                      {% for line2 in qos_data.stdout_lines %}
                        {% if 'Queue ' ~ q in line2 %}
                          {% set parts = line2.split() %}
                          {% for part in parts %}
                            {% if part == '0' or part|int > 0 %}
                              {% set new_value = part|int %}
                            {% endif %}
                          {% endfor %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                  {% endfor %}
                  
                  {# 更新该列 #}
                  {% set col_index = header.split(',') | index(new_column) %}
                  {% if col_index >= 0 and col_index < row|length %}
                    {% set row[col_index] = new_value|string %}
                  {% endif %}
                  {{ row|join(',') }}
                {% endfor %}
              {% else %}
                {# 添加新列 #}
                {{ header }},{{ new_column }}
                {% for line in data %}
                  {% set row = line.split(',') %}
                  {% set interface = row[1] %}
                  {% set queue = row[2] %}
                  
                  {# 获取新值 #}
                  {% set new_value = 0 %}
                  {% for q in range(8) %}
                    {% if queue == 'queue_' ~ q %}
                      {% for line2 in qos_data.stdout_lines %}
                        {% if 'Queue ' ~ q in line2 %}
                          {% set parts = line2.split() %}
                          {% for part in parts %}
                            {% if part == '0' or part|int > 0 %}
                              {% set new_value = part|int %}
                            {% endif %}
                          {% endfor %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                  {% endfor %}
                  
                  {{ line }},{{ new_value }}
                {% endfor %}
              {% endif %}
            {% else %}
              {# 文件为空，创建新文件 #}
Host,Interface,Queue,{{ new_column }}
{% for q in range(8) %}
{% set value = 0 %}
{% for line in qos_data.stdout_lines %}
{% if 'Queue ' ~ q in line %}
{% set parts = line.split() %}
{% for part in parts %}
{% if part == '0' or part|int > 0 %}
{% set value = part|int %}
{% endif %}
{% endfor %}
{% endif %}
{% endfor %}
{{ inventory_hostname }},100GE1/1/1,queue_{{ q }},{{ value }}
{% endfor %}
            {% endif %}
          {% else %}
            {# 文件不存在，创建新文件 #}
Host,Interface,Queue,{{ new_column }}
{% for q in range(8) %}
{% set value = 0 %}
{% for line in qos_data.stdout_lines %}
{% if 'Queue ' ~ q in line %}
{% set parts = line.split() %}
{% for part in parts %}
{% if part == '0' or part|int > 0 %}
{% set value = part|int %}
{% endif %}
{% endfor %}
{% endif %}
{% endfor %}
{{ inventory_hostname }},100GE1/1/1,queue_{{ q }},{{ value }}
{% endfor %}
          {% endif %}
        dest: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        mode: '0644'
      delegate_to: localhost
    
    # 6. 上传更新后的文件
    - name: Upload updated CSV
      copy:
        src: "{{ output_dir }}/{{ inventory_hostname }}_qos.csv"
        dest: "{{ historical_file }}"
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ report_server }}"
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_pass: "3edc$RFV"
